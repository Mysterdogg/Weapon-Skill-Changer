; Weapon Skill Changer v1.0.0 by Mysterdogg
;
; Any missing key falls back to its default value.

[Keys]
; Windows virtual-key codes, in DECIMAL. Set a key to 0 to disable it.
; Numpad keys need NumLock ON.
NextTier=105     ; Num 9 - next tier (Poor > Gangster > Hitman > Poor)
PrevTier=99      ; Num 3 - previous tier
RaiseValue=102   ; Num 6 - raise raw skill value by Step
LowerValue=100   ; Num 4 - lower raw skill value by Step
ShowInfo=101     ; Num 5 - show info for the current weapon
MaxAll=103       ; Num 7 - all weapon skills to 1000 (Hitman)
ResetAll=97      ; Num 1 - all weapon skills to 0 (Poor)
; Optional key that must be held for any hotkey to work (0 = none).
; Examples: 16 Shift | 17 Ctrl | 18 Alt
Modifier=0

[Settings]
; Raw skill points added/removed per press (stat range is 0-1000)
Step=50
; 1 = show a text box after every change, 0 = silent (ShowInfo still works)
ShowFeedback=1
; How long on-screen messages stay visible, in milliseconds
TextTime=2000
